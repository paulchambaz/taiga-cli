[package]
name = "taiga-cli"
description = "Cli tool for taiga.io inspired by taskwarrior"
authors = ["Paul Chambaz <paul.chambaz@tutanota.com>"]
homepage = "https://github.com/paulchambaz/taiga-cli"
version = "1.1.3"
edition = "2021"
include = ["/src/**/*", "/completions/*", "/taiga.1.scd", "/README.md", "/LICENSE"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/paulchambaz/taiga-cli"
documentation = "https://docs.rs/taiga-cli"
keywords = ["taiga", "cli", "kanban", "taskwarrior", "project-management"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.79"
bincode = "1.3.3"
chrono = { version = "0.4.34", features = ["serde"] }
colored = "2.1.0"
directories = "5.0.1"
prettytable-rs = "0.10.0"
reqwest = { version = "0.11.24", features = ["blocking", "json"] }
rpassword = "7.3.1"
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
thiserror = "1.0.69"
temporis = "1.0.2"

[[bin]]
name = "taiga"
path = "src/main.rs"
